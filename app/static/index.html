<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GraphRAG 라이브 랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/lab.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 6l6 10 6-9M5 6l12 1"/></g><circle cx="5" cy="6" r="2.6" fill="var(--accent)"/><circle cx="17" cy="7" r="2.6" fill="var(--vec)"/><circle cx="11" cy="16" r="2.6" fill="var(--hyb)"/></svg>
    <span>GraphRAG <span class="full" data-i18n="라이브 랩|Live Lab">라이브 랩</span></span>
  </div>
  <nav class="viewtabs" role="tablist" aria-label="View">
    <button type="button" role="tab" id="tabLecture" aria-selected="true" data-i18n="강의|Lecture">강의</button>
    <button type="button" role="tab" id="tabLab" aria-selected="false" data-i18n="라이브 실험실|Live lab">라이브 실험실</button>
  </nav>
  <div class="spacer"></div>
  <span class="status" id="status"></span>
  <div class="seg" id="langSel" role="group" aria-label="Language"><button type="button" data-lang="ko" aria-pressed="false" title="한국어">KO</button><button type="button" data-lang="en" aria-pressed="false" title="English">EN</button></div>
  <button class="btn" id="zoomBtn" type="button" title="프로젝터용 글자 크기" data-i18n="가⁺|A⁺" data-i18n-title="프로젝터용 글자 크기|Larger text for projectors">가⁺</button>
  <button class="btn" id="openFiles" type="button" data-i18n="코드·데이터|Code &amp; data">코드·데이터</button>
  <button class="btn primary" id="presentBtn" type="button" data-i18n="발표 모드|Present">발표 모드</button>
</header>

<div id="lectureView">
<nav class="mobile-toc" id="mobileToc" aria-label="Contents"></nav>
<div class="shell">
<nav class="toc" aria-label="Contents"><ol id="toc"></ol></nav>
<main id="main">
<!-- 강의 내용은 lecture.<lang>.html 에서 불러온다 (app.js) -->
</main>
</div>
<div class="pnav" id="pnav" aria-label="Slides">
  <button type="button" id="prevBtn" aria-label="Previous">←</button>
  <span id="pcount">1 / 1</span>
  <button type="button" id="nextBtn" aria-label="Next">→</button>
  <button type="button" id="exitBtn" data-i18n="종료|Exit">종료</button>
</div>
</div>

<div id="labView" hidden>
  <div class="lab-top">
    <div class="modes" role="tablist" id="modes"></div>
    <form class="qform" id="qform">
      <label class="sr" for="qinput" data-i18n="질문|Question">질문</label>
      <input id="qinput" type="text" autocomplete="off" placeholder="질문을 입력하거나 아래 예시를 고르세요" data-i18n-placeholder="질문을 입력하거나 아래 예시를 고르세요|Type a question or pick an example below">
      <label class="kpick">k <select id="kSelect"><option>3</option><option selected>5</option></select></label>
      <label class="kpick"><span data-i18n="임베딩|Embedding">임베딩</span> <select id="embSelect"></select></label>
      <button class="btn primary" type="submit" id="runBtn" data-i18n="실행|Run">실행</button>
    </form>
    <div class="samples" id="samples"></div>
  </div>
  <div class="lab-main" id="labMain">
    <aside class="stepper" aria-label="Steps">
      <div class="stepper-head">
        <b id="stepperTitle" data-i18n="처리 단계|Processing steps">처리 단계</b>
        <label class="reveal"><input type="checkbox" id="revealMode" checked> <span data-i18n="단계별 공개|Reveal step by step">단계별 공개</span></label>
      </div>
      <ol id="steps"></ol>
      <div class="stepnav"><button class="btn" type="button" id="stepPrev" data-i18n="← 이전|← Prev">← 이전</button><button class="btn primary" type="button" id="stepNext" data-i18n="다음 단계 →|Next step →">다음 단계 →</button></div>
    </aside>
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="visual">
      <div class="visual-head"><b id="visualTitle" data-i18n="지식그래프|Knowledge graph">지식그래프</b><span id="visualNote"></span></div>
      <div class="svgbox"><svg class="graph" id="vis" role="img" aria-label="Visualization"></svg></div>
      <div class="legend" id="visLegend"></div>
      <div class="info" id="nodeInfo" hidden></div>
    </aside>
  </div>
</div>

<div class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="Code and data">
  <div class="panel">
    <header>
      <span class="path" id="fpath"></span>
      <button class="btn" type="button" id="copyBtn" data-i18n="복사|Copy">복사</button>
      <button class="btn" type="button" id="closeBtn" data-i18n="닫기 (Esc)|Close (Esc)">닫기 (Esc)</button>
    </header>
    <nav class="tree" id="tree"></nav>
    <div class="viewer" id="viewer"><div class="band" id="band" hidden></div><pre class="gut" id="gutter"></pre><pre><code id="code"></code></pre></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/static/app.js"></script>
<script src="/static/live.js"></script>
</body>
</html>
